<ion-header>
  <h2 class="ion-text-center">Movies</h2>
<ion-button fill="clear" slot="start">
  <ion-back-button  defaultHref="/home"></ion-back-button>
</ion-button>

  <ion-searchbar
    placeholder="Recherche de film"
    [debounce]="100"
    (ionInput)="getSearchValue($event)"
  ></ion-searchbar>

</ion-header>

<ion-content>
  <ion-list>
    @for (m of filteredMovies(); track m.id) {
      <ion-item-sliding>
        <ion-item>
          
          <ion-thumbnail (click)="navigateToDetails(m.id)">
            <img [src]="m.imageUrl" [alt]="m.title">
          </ion-thumbnail>
          
          <ion-label class="ion-text-center" (click)="navigateToDetails(m.id)">
            <h2>{{m.title}}</h2>
            <p>{{m.year}}</p>
          </ion-label>          
        </ion-item>
        
        <ion-item-options side="start" (ionSwipe)="addToFavorite(m)">
          <ion-item-option color="primary" expandable (click)="addToFavorite(m)">
            <ion-icon slot="bottom" name="star-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>

      </ion-item-sliding>
    }@empty {

      <ion-item>
        Aucun film trouvé
      </ion-item>
    }
  </ion-list>
</ion-content>
