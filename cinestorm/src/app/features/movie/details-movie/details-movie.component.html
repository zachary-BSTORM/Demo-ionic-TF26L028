<ion-header>
  <h2>Détails Movie</h2>
  <ion-back-button></ion-back-button>
</ion-header>

<ion-content>
<ion-card>
<ion-card-header>
  <h2>{{movie()?.title}}</h2>
</ion-card-header>
  <ion-card-content>
    <img [src]="movie()?.imageUrl" [alt]="movie()?.title">

    <p>{{movie()?.description}}</p>
    <p>{{movie()?.year}}</p>
  </ion-card-content>
  
  <ion-button color="primary" (click)="navigateToUpdate()">Update</ion-button>
</ion-card>
</ion-content>
